<svg xmlns="http://www.w3.org/2000/svg" width="820" height="636" viewBox="0 0 820 636" role="img" aria-label="pi-cyber-ui surfaces: gutter, HUD, editor, footer">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="820" height="636" rx="12" fill="#0a0a0d"/>
  <rect x=".5" y=".5" width="819" height="635" rx="12" fill="none" stroke="#1f2335"/>

  <!-- signal -->
  <text class="sans" x="20" y="28" fill="#7dcfff" font-size="10" letter-spacing="1.8">SIGNAL</text>
  <g font-size="12" class="mono">
    <rect x="20" y="38" width="112" height="26" rx="6" fill="#16161e" stroke="#1f2335"/>
    <rect x="20" y="38" width="4" height="26" rx="2" fill="#7aa2f7"/>
    <text x="34" y="55" fill="#7aa2f7">running</text>

    <rect x="140" y="38" width="112" height="26" rx="6" fill="#16161e" stroke="#1f2335"/>
    <rect x="140" y="38" width="4" height="26" rx="2" fill="#4fd6be"/>
    <text x="154" y="55" fill="#4fd6be">success</text>

    <rect x="260" y="38" width="112" height="26" rx="6" fill="#16161e" stroke="#1f2335"/>
    <rect x="260" y="38" width="4" height="26" rx="2" fill="#f7768e"/>
    <text x="274" y="55" fill="#f7768e">failure</text>

    <rect x="380" y="38" width="128" height="26" rx="6" fill="#16161e" stroke="#1f2335"/>
    <rect x="380" y="38" width="4" height="26" rx="2" fill="#fca7ea"/>
    <text x="394" y="55" fill="#fca7ea">user input</text>
  </g>

  <!-- gutter -->
  <text class="sans" x="20" y="90" fill="#7dcfff" font-size="10" letter-spacing="1.8">TOOL GUTTER</text>
  <g transform="translate(20,100)">
    <rect width="780" height="248" rx="9" fill="#0a0a0d" stroke="#565f89"/>
    <rect width="780" height="28" rx="9" fill="#1f2335"/>
    <rect y="18" width="780" height="10" fill="#1f2335"/>
    <circle cx="16" cy="14" r="4" fill="#f7768e"/>
    <circle cx="30" cy="14" r="4" fill="#e0af68"/>
    <circle cx="44" cy="14" r="4" fill="#9ece6a"/>
    <text class="mono" x="60" y="18" fill="#565f89" font-size="11">gutter · panel #121218 · bar ▍ static</text>

    <g font-size="13" class="mono">
      <!-- user -->
      <rect x="1" y="32" width="778" height="24" fill="#121218"/>
      <rect x="1" y="32" width="4" height="24" fill="#fca7ea"/>
      <text x="16" y="48"><tspan fill="#aab8ca">❯</tspan><tspan fill="#c8d3ea">  make the tool row a neon fish gutter</tspan></text>

      <!-- pending bash -->
      <rect x="1" y="56" width="778" height="24" fill="#121218"/>
      <rect x="1" y="56" width="4" height="24" fill="#7aa2f7"/>
      <text x="16" y="72"><tspan fill="#7dcfff" font-weight="700">$</tspan><tspan fill="#7dcfff"> npm</tspan><tspan fill="#a9b1d6"> run typecheck</tspan></text>

      <!-- read -->
      <rect x="1" y="80" width="778" height="24" fill="#121218"/>
      <rect x="1" y="80" width="4" height="24" fill="#4fd6be"/>
      <text x="16" y="96"><tspan fill="#7dcfff" font-weight="700">read</tspan><tspan fill="#a9b1d6">  extensions/pi-cyber-ui/palette.ts</tspan><tspan fill="#565f89">   120 lines</tspan></text>

      <!-- edit + diff -->
      <rect x="1" y="104" width="778" height="88" fill="#121218"/>
      <rect x="1" y="104" width="4" height="88" fill="#4fd6be"/>
      <text x="16" y="120"><tspan fill="#7dcfff" font-weight="700">edit</tspan><tspan fill="#a9b1d6">  themes/cyber-ui-dark.json</tspan></text>
      <text x="16" y="142" fill="#565f89">  12   "vars": {</text>
      <text x="16" y="164" fill="#f7768e">- 13     "toolSuccessBg": "#0b1020",</text>
      <text x="16" y="186" fill="#4fd6be">+ 13     "toolSurface": "#121218",</text>

      <!-- error -->
      <rect x="1" y="192" width="778" height="55" fill="#121218"/>
      <rect x="1" y="228" width="778" height="19" rx="8" fill="#121218"/>
      <rect x="1" y="192" width="4" height="55" fill="#f7768e"/>
      <text x="16" y="210"><tspan fill="#7dcfff" font-weight="700">edit</tspan><tspan fill="#a9b1d6">  themes/cyber-ui-dark.json</tspan></text>
      <text x="16" y="230" fill="#f7768e">✗ oldText not found</text>
    </g>
  </g>

  <!-- hud -->
  <text class="sans" x="20" y="374" fill="#7dcfff" font-size="10" letter-spacing="1.8">WORKING HUD</text>
  <g transform="translate(20,384)">
    <rect width="780" height="72" rx="9" fill="#16161e" stroke="#1f2335"/>
    <text class="mono" x="16" y="30" font-size="13">
      <tspan fill="#fca7ea">●</tspan>
      <tspan fill="#c8d3ea">  Reasoning...</tspan>
      <tspan fill="#565f89">  (</tspan>
      <tspan fill="#a9b1d6">12s</tspan>
      <tspan fill="#565f89"> · </tspan>
      <tspan fill="#565f89">↑47.3k </tspan>
      <tspan fill="#a9b1d6">↓1.50k</tspan>
      <tspan fill="#565f89"> · </tspan>
      <tspan fill="#9ece6a">182 tps</tspan>
      <tspan fill="#565f89">)</tspan>
    </text>
    <text class="mono" x="16" y="54" font-size="13">
      <tspan fill="#9ece6a" font-weight="700">✓</tspan>
      <tspan fill="#a9b1d6">  done</tspan>
      <tspan fill="#565f89"> · </tspan>
      <tspan fill="#a9b1d6">2:14</tspan>
      <tspan fill="#565f89"> · </tspan>
      <tspan fill="#a9b1d6">↑47.3k ↓3.20k</tspan>
      <tspan fill="#565f89"> · </tspan>
      <tspan fill="#565f89">156 tps</tspan>
    </text>
  </g>

  <!-- editor + footer -->
  <text class="sans" x="20" y="482" fill="#7dcfff" font-size="10" letter-spacing="1.8">EDITOR + FOOTER</text>
  <g transform="translate(20,492)">
    <rect width="780" height="122" rx="9" fill="#0a0a0d" stroke="#565f89"/>

    <!-- top rule: full width, session label docked right -->
    <line x1="16" y1="22" x2="608" y2="22" stroke="#7dcfff" stroke-width="1.25" stroke-linecap="square"/>
    <text class="mono" x="728" y="26" text-anchor="end" fill="#7dcfff" font-size="13">⟦ refactor-ui ⟧</text>
    <line x1="736" y1="22" x2="764" y2="22" stroke="#7dcfff" stroke-width="1.25" stroke-linecap="square"/>

    <text class="mono" x="16" y="54" font-size="13">
      <tspan fill="#aab8ca">❯</tspan>
      <tspan fill="#c0caf5">  keep tps on the working line after idle</tspan>
    </text>

    <line x1="16" y1="72" x2="764" y2="72" stroke="#7dcfff" stroke-width="1.25" stroke-linecap="square"/>

    <!-- footer: left status · right path/git -->
    <text class="mono" x="16" y="102" font-size="12">
      <tspan fill="#a9b1d6">gpt-5</tspan>
      <tspan fill="#565f89"> · </tspan>
      <tspan fill="#f7768e" font-weight="700">thinking max</tspan>
      <tspan fill="#565f89"> · </tspan>
    </text>
    <g transform="translate(214,94)">
      <rect x="0" y="0" width="6" height="8" fill="#41a6b5"/>
      <rect x="8" y="0" width="6" height="8" fill="#41a6b5"/>
      <rect x="16" y="0" width="6" height="8" fill="#41a6b5"/>
      <rect x="24" y="0" width="6" height="8" fill="#41a6b5"/>
      <rect x="32" y="0" width="6" height="8" fill="#565f89"/>
      <rect x="40" y="0" width="6" height="8" fill="#565f89"/>
      <rect x="48" y="0" width="6" height="8" fill="#565f89"/>
      <rect x="56" y="0" width="6" height="8" fill="#565f89"/>
      <rect x="64" y="0" width="6" height="8" fill="#565f89"/>
      <rect x="72" y="0" width="6" height="8" fill="#565f89"/>
    </g>
    <text class="mono" x="302" y="102" font-size="12">
      <tspan fill="#a9b1d6">42%</tspan>
      <tspan fill="#565f89"> · </tspan>
      <tspan fill="#9ece6a">⚡ 87%</tspan>
    </text>
    <text class="mono" x="764" y="102" text-anchor="end" font-size="12">
      <tspan fill="#fca7ea">~</tspan>
      <tspan fill="#565f89">/dev/</tspan>
      <tspan fill="#c0caf5" font-weight="700">pi-cyber-ui</tspan>
      <tspan fill="#565f89"> · </tspan>
      <tspan fill="#9ece6a">+12</tspan>
      <tspan fill="#e0af68"> ~3</tspan>
      <tspan fill="#f7768e"> −1</tspan>
    </text>
  </g>
</svg>
